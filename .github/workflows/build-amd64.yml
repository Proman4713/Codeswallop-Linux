name: Build Utile OS 26 AMD64 ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  gen-custom-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Preseed snaps and inject disk release
        env:
          # If this was triggered by a tag (release), set to release. Otherwise, nightly will automatically be used.
          BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
        run: |
          pnpm install
          node src/preseed-snaps.js

          # Run the compilation script
          SH_NAME=$(node . | tail -n 1)

          TEMP_NAME=${SH_NAME#utile-os-}
          TAG_NAME=${TEMP_NAME%.sh}
          ISO_NAME="${SH_NAME%.sh}"

          echo "SH_NAME=$SH_NAME" >> $GITHUB_ENV
          echo "ISO_NAME=$ISO_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          
          # Verify the output exists
          ls -la "dist/$SH_NAME"

          node src/inject-disk-release.js
    
      - name: Inject GRUB config
        run: |
          sudo mkdir -p tooling/iso_overlay/boot/grub
          sudo tee tooling/iso_overlay/boot/grub/grub.cfg << 'EOF'
          set timeout=30

          # https://www.gnu.org/software/grub/manual/grub/grub.html#GNU_002fLinux (REMOVE WHEN USING UBUNTU OFFICIAL GRUB)
          # search --set=root --file /casper/vmlinuz

          loadfont unicode

          set menu_color_normal=white/black
          set menu_color_highlight=black/light-gray

          menuentry "Try or Install Utile" --class utile --class ubuntu --class gnu-linux --class gnu --class os {
              set gfxpayload=keep
              linux  /casper/vmlinuz  --- quiet splash
              initrd /casper/initrd
          }
          menuentry "Utile (safe graphics)" --class utile --class ubuntu --class gnu-linux --class gnu --class os {
              set gfxpayload=keep
              linux  /casper/vmlinuz nomodeset  --- quiet splash
              initrd /casper/initrd
          }
          grub_platform
          if [ "$grub_platform" = "efi" ]; then
          menuentry 'Boot from next volume' {
             exit 1
          }
          menuentry 'UEFI Firmware Settings' {
             fwsetup
          }
          fi
          EOF
    
      - name: Build
        run: |
          mkdir -p ${{ github.workspace }}/temp
          (cat << 'EOF'
          set -exuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y \
            debootstrap \
            ubuntu-keyring \
            squashfs-tools \
            xorriso \
            dosfstools \
            mtools \
            syslinux-utils \
            grub-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            cpio

          export CHROOT_DIR="/workspace/chroot"
          mkdir -p "$CHROOT_DIR"
          debootstrap \
            --arch=amd64 \
            --components=main,restricted,universe,multiverse \
            --keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg \
            --verbose \
            resolute \
            "$CHROOT_DIR" \
            http://archive.ubuntu.com/ubuntu

          # Mount host directories inside chroot
          mount --bind /dev "$CHROOT_DIR/dev"
          mount --bind /dev/pts "$CHROOT_DIR/dev/pts"
          mount -t proc /proc "$CHROOT_DIR/proc"
          mount -t sysfs /sys "$CHROOT_DIR/sys"
          mount --bind /run "$CHROOT_DIR/run"

          rm -f "$CHROOT_DIR/etc/resolv.conf"
          cp -L /etc/resolv.conf "$CHROOT_DIR/etc/resolv.conf"

          cp /workspace/dist/${{ env.SH_NAME }} "$CHROOT_DIR/opt/"
          chmod +x "$CHROOT_DIR/opt/${{ env.SH_NAME }}"
          chroot "$CHROOT_DIR" /bin/bash -xlc "/opt/${{ env.SH_NAME }}"
          rm -f "$CHROOT_DIR/opt/${{ env.SH_NAME }}"

          # Kernel and INITRD
          export ISO_DIR="/workspace/custom-iso"
          mkdir -p "$ISO_DIR/casper"
          VMLINUZ=$(ls -1 "$CHROOT_DIR/boot/vmlinuz-*" | tail -n 1)
          INITRD=$(ls -1 "$CHROOT_DIR/boot/initrd.img-*" | tail -n 1)
          cp "$VMLINUZ" "$ISO_DIR/casper/vmlinuz"
          cp "$INITRD" "$ISO_DIR/casper/initrd"

          # Remove casper from inside the chroot after copying the casper-enabled initrd out of it and restore dracut
          chroot "$CHROOT_DIR" /bin/bash -xlc "export DEBIAN_FRONTEND=noninteractive && apt-get purge -y casper && apt-get install -y dracut && apt-get purge -y initramfs-tools && apt-get autoremove -y --purge && apt-get clean"

          # Restore original resolv.conf
          rm -f "$CHROOT_DIR/etc/resolv.conf"
          chroot "$CHROOT_DIR" /bin/bash -xlc "ln -s /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf"

          # Snap seed
          mkdir -p "$CHROOT_DIR/var/lib/snapd/seed/"
          cp -r /workspace/tooling/seed/* "$CHROOT_DIR/var/lib/snapd/seed/"

          umount --lazy "$CHROOT_DIR/run"
          umount --lazy "$CHROOT_DIR/sys"
          umount --lazy "$CHROOT_DIR/proc"
          umount --lazy "$CHROOT_DIR/dev/pts"
          umount --lazy "$CHROOT_DIR/dev"

          # Make squashfs
          mksquashfs "$CHROOT_DIR" "$ISO_DIR/casper/filesystem.squashfs" -comp xz -noappend -e boot

          # Casper metadata
          printf '%s' "$(du -sx --block-size=1 "$CHROOT_DIR" | cut -f1)" \
            > "$ISO_DIR/casper/filesystem.size"
          chroot "$CHROOT_DIR" dpkg-query \
            -W --showformat='${Package} ${Version}\n' | sort \
            > "$ISO_DIR/casper/filesystem.manifest"

          # .disk/ and iso_overlay/
          cp -r /workspace/tooling/.disk "$ISO_DIR"
          if [ -d /workspace/tooling/iso_overlay ]; then
            cp -r /workspace/tooling/iso_overlay/* "$ISO_DIR"
          fi

          # Parity with official ISOs
          ln -s . "$ISO_DIR/ubuntu"
          touch "$ISO_DIR/.disk/base_installable"
          echo "full_cd/single" > "$ISO_DIR/.disk/cd_type"
          mkdir -p "$ISO_DIR/boot/grub/fonts"
          cp /usr/share/grub/unicode.pf2 "$ISO_DIR/boot/grub/fonts" || true

          # GRUB BIOS
          grub-mkstandalone \
            --format=i386-pc \
            --output=/tmp/core.img \
            --install-modules="linux normal iso9660 biosdisk memdisk search tar ls" \
            --modules="linux normal iso9660 biosdisk search" \
            --locales="" \
            --fonts="" \
            "boot/grub/grub.cfg=$ISO_DIR/boot/grub/grub.cfg"

          cat /usr/lib/grub/i386-pc/cdboot.img /tmp/core.img \
            > "$ISO_DIR/boot/grub/bios.img"

          # Official GRUB images
                OFFICIAL_IMAGES="/tmp/extracted-uefi-images"
                mkdir -p "$OFFICIAL_IMAGES"
                apt-get download shim-signed grub-efi-amd64-signed grub-pc-bin grub-efi-amd64-bin
                for deb in *.deb; do dpkg -x "$deb" "$OFFICIAL_IMAGES"; done

                # boot/grub/
                mkdir -p "$ISO_DIR/boot/grub/x86_64-efi/"
                cp "$OFFICIAL_IMAGES/usr/lib/grub/x86_64-efi/." "$ISO_DIR/boot/grub/x86_64-efi/"
                mkdir -p "$ISO_DIR/boot/grub/i386-pc/"
                cp "$OFFICIAL_IMAGES/usr/lib/grub/i386-pc/." "$ISO_DIR/boot/grub/i386-pc/"

                # EFI/boot
                mkdir -p "$ISO_DIR/EFI/boot"
                cp "$OFFICIAL_IMAGES/usr/lib/shim/shimx64.efi" "$ISO_DIR/EFI/boot/bootx64.efi"
                cp "$OFFICIAL_IMAGES/usr/lib/shim/mmx64.efi" "$ISO_DIR/EFI/boot/mmx64.efi"
                cp "$OFFICIAL_IMAGES/usr/lib/grub/grubx64.efi.signed" "$ISO_DIR/EFI/boot/grubx64.efi"

          # Copy 10 MBs from /dev/zero to an image file to create it
          dd if=/dev/zero of=/tmp/efi.img bs=1M count=10
          # Create a FAT filesystem there
          mkfs.fat /tmp/efi.img
          # Create the EFI/boot folder inside the image (-i to specify an image file)
          mmd -i /tmp/efi.img ::/EFI ::/EFI/boot

          # Copy the official UEFI images to the EFI/boot directory inside this image
          mcopy -i /tmp/efi.img "$ISO_DIR/EFI/boot/bootx64.efi" ::/EFI/boot/bootx64.efi
          mcopy -i /tmp/efi.img "$ISO_DIR/EFI/boot/grubx64.efi" ::/EFI/boot/grubx64.efi
          mcopy -i /tmp/efi.img "$ISO_DIR/EFI/boot/mmx64.efi" ::/EFI/boot/mmx64.efi

          # md5sum
          (cd "$ISO_DIR" && find . -type f ! -name "md5sum.txt" ! -name "eltorito.img" ! -name "grub.cfg" -print0 | sort -z | xargs -0 md5sum > "$ISO_DIR/md5sum.txt")

          xorriso -as mkisofs \
            -iso-level 3 \
            -joliet \
            -full-iso9660-filenames \
            -volid "Utile OS 26 amd64" \
            --mbr-force-bootable \
            -eltorito-boot boot/grub/bios.img \
              -no-emul-boot \
              -boot-load-size 4 \
              -boot-info-table \
              --grub2-boot-info \
              --grub2-mbr /usr/lib/grub/i386-pc/boot_hybrid.img \
            -eltorito-alt-boot \
              -e --interval:appended_partition_2:all:: \
              -no-emul-boot \
              --protective-msdos-label \
            -append_partition 2 0xef /tmp/efi.img \
            -appended_part_as_gpt \
            -c boot.catalog \
            -o /workspace/${{ env.ISO_NAME }}-amd64.iso \
            "$ISO_DIR"
        
          echo "ISO created: $(ls -lh /workspace/${{ env.ISO_NAME }}-amd64.iso)"
          EOF
          ) > ${{ github.workspace }}/temp/docker-live-build.sh

          docker run --privileged -v ${{ github.workspace }}:/workspace --platform linux/amd64 --name utile-build-container -w /workspace ubuntu:26.04 /bin/bash /workspace/temp/docker-live-build.sh
    
      - name: Upload script to GitHub Releases
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Utile OS ${{ env.TAG_NAME }}
          files: |
            dist/${{ env.SH_NAME }}
          # Automatically mark as pre-release if it's a nightly or beta
          prerelease: ${{ contains(env.TAG_NAME, 'nightly') || contains(env.TAG_NAME, 'beta') }}

      - name: Upload ISO to Gofile.io
        env:
          GOFILE_KEY: ${{ secrets.GOFILE_KEY }}
        run: |
          RESPONSE=$(curl --progress-bar --retry 3 -X POST -F "file=@${{ env.ISO_NAME }}-amd64.iso" -F "folderId=99d5ecff-d083-417b-9c48-c04d0b6eae11" -H "Authorization: Bearer ${{ env.GOFILE_KEY }}" -H "Accept: application/json" "https://upload.gofile.io/contents/uploadfile")
          CONTENT_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          echo "Uploaded ISO to Gofile with ID: $CONTENT_ID"
          
          # calculate sha256 checksum
          sha256sum ${{ env.ISO_NAME }}-amd64.iso > ${{ env.ISO_NAME }}-amd64.iso.sha256sum
          echo "sha256sum: $(cat ${{ env.ISO_NAME }}-amd64.iso.sha256sum)"
          
          # Upload checksum to Gofile
          curl --progress-bar --retry 3 -X POST -F "file=@${{ env.ISO_NAME }}-amd64.iso.sha256sum" -F "folderId=99d5ecff-d083-417b-9c48-c04d0b6eae11" -H "Authorization: Bearer ${{ env.GOFILE_KEY }}" "https://upload.gofile.io/contents/uploadfile"