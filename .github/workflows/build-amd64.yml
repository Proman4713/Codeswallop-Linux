name: Build Utile OS 26 AMD64 ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  gen-custom-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Preseed snaps and inject disk release
        env:
          # If this was triggered by a tag (release), set to release. Otherwise, nightly will automatically be used.
          BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
        run: |
          pnpm install
          node src/preseed-snaps.js

          # Run the compilation script
          SH_NAME=$(node . | tail -n 1)

          TEMP_NAME=${SH_NAME#utile-os-}
          TAG_NAME=${TEMP_NAME%.sh}
          ISO_NAME="${SH_NAME%.sh}"

          echo "SH_NAME=$SH_NAME" >> $GITHUB_ENV
          echo "ISO_NAME=$ISO_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          
          # Verify the output exists
          ls -la "dist/$SH_NAME"

          node src/inject-disk-release.js
    
      - name: Inject GRUB theme
        run: |
          set -exuo pipefail # Strict

          mkdir -p temp-grub/

          if ! curl -fsSL https://proman4713.github.io/Utile-OS-apt/public.key | sudo gpg --dearmor -o /etc/apt/keyrings/utile.gpg; then
            echo "Error: Failed to download or install Utile GPG key" >&2
            exit 1
          fi
          echo "deb [signed-by=/etc/apt/keyrings/utile.gpg] https://proman4713.github.io/Utile-OS-apt/ abstract main upstream universe" | sudo tee /etc/apt/sources.list.d/utile.list
          sudo apt-get update

          wget -qO utile-grub-theme.deb $(apt download --print-uris utile-grub-theme 2>/dev/null | awk -F"'" '{print $2}')
          sudo dpkg -x utile-grub-theme.deb temp-grub/

          sudo mkdir -p tooling/iso_overlay/boot/grub/themes/utile
          sudo mkdir -p tooling/iso_overlay/boot/grub/fonts/

          THEME_PATH="temp-grub/boot/grub/themes/utile"
          sudo cp -r $THEME_PATH/* tooling/iso_overlay/boot/grub/themes/utile/
          # Remove fonts from theme folder and copy them to /boot/grub/fonts instead
          sudo rm -f tooling/iso_overlay/boot/grub/themes/utile/*.pf2
          sudo cp -r $THEME_PATH/*.pf2 tooling/iso_overlay/boot/grub/fonts/
    
      - name: Inject GRUB config
        run: |
          sudo mkdir -p tooling/iso_overlay/boot/grub
          sudo tee tooling/iso_overlay/boot/grub/grub.cfg << 'EOF'
          # To render the theme
          insmod gfxterm
          insmod video_fb
          insmod efi_gop
          # For the icons
          insmod png

          set timeout=10
          set gfxmode=1920x1080,auto
          # https://www.gnu.org/software/grub/manual/grub/grub.html#GNU_002fLinux (REMOVE WHEN USING UBUNTU OFFICIAL GRUB)
          search --set=root --file /casper/vmlinuz

          # Set terminal output mode
          terminal_output gfxterm

          loadfont unicode
          loadfont ubuntu-sans-bold-18
          loadfont ubuntu-sans-bold-20
          loadfont ubuntu-sans-bold-24
          loadfont ubuntu-sans-extrabold-20

          set theme=($root)/boot/grub/themes/utile/theme.txt
          set menu_color_normal=white/black
          set menu_color_highlight=black/light-gray

          menuentry "Try or Install Utile" --class utile --class ubuntu --class gnu-linux --class gnu --class os {
              set gfxpayload=keep
              linux  /casper/vmlinuz  --- quiet splash
              initrd /casper/initrd
          }
          menuentry "Utile (safe graphics)" --class utile --class ubuntu --class gnu-linux --class gnu --class os {
              set gfxpayload=keep
              linux  /casper/vmlinuz nomodeset  --- quiet splash
              initrd /casper/initrd
          }
          grub_platform
          if [ "$grub_platform" = "efi" ]; then
          menuentry 'Boot from next volume' {
             exit 1
          }
          menuentry 'UEFI Firmware Settings' {
             fwsetup
          }
          fi
          EOF
    
      - name: Build
        run: |
          mkdir -p ${{ github.workspace }}/temp
          (cat << 'EOF'
          set -exuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y \
            debootstrap \
            ubuntu-keyring \
            squashfs-tools \
            xorriso \
            dosfstools \
            mtools \
            syslinux-utils \
            grub-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            cpio

          mkdir -p /workspace/chroot
          debootstrap \
            --arch=amd64 \
            --components=main,restricted,universe,multiverse \
            --keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg \
            --verbose \
            resolute \
            /workspace/chroot \
            http://archive.ubuntu.com/ubuntu

          # Mount host directories inside chroot
          mount --bind /dev /workspace/chroot/dev
          mount --bind /dev/pts /workspace/chroot/dev/pts
          mount -t proc /proc /workspace/chroot/proc
          mount -t sysfs /sys /workspace/chroot/sys
          mount --bind /run /workspace/chroot/run

          rm -f /workspace/chroot/etc/resolv.conf
          cp -L /etc/resolv.conf /workspace/chroot/etc/resolv.conf

          cp /workspace/dist/${{ env.SH_NAME }} /workspace/chroot/opt/
          chmod +x /workspace/chroot/opt/${{ env.SH_NAME }}
          chroot /workspace/chroot /bin/bash -xlc "/opt/${{ env.SH_NAME }}"
          rm -f /workspace/chroot/opt/${{ env.SH_NAME }}

          # Restore original resolv.conf
          rm -f /workspace/chroot/etc/resolv.conf
          chroot /workspace/chroot /bin/bash -xlc "ln -s /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf"

          # Snap seed
          mkdir -p /workspace/chroot/var/lib/snapd/seed/
          cp -r /workspace/tooling/seed/* /workspace/chroot/var/lib/snapd/seed/

          umount --lazy /workspace/chroot/run
          umount --lazy /workspace/chroot/sys
          umount --lazy /workspace/chroot/proc
          umount --lazy /workspace/chroot/dev/pts
          umount --lazy /workspace/chroot/dev

          # Make squashfs
          mkdir -p /workspace/custom-iso/casper
          mksquashfs /workspace/chroot /workspace/custom-iso/casper/filesystem.squashfs -comp xz -noappend -e boot

          # Kernel and INITRD
          VMLINUZ=$(ls -1 /workspace/chroot/boot/vmlinuz-* | tail -n 1)
          INITRD=$(ls -1 /workspace/chroot/boot/initrd.img-* | tail -n 1)
          cp "$VMLINUZ" /workspace/custom-iso/casper/vmlinuz
          cp "$INITRD" /workspace/custom-iso/casper/initrd

          # Casper metadata
          printf '%s' "$(du -sx --block-size=1 /workspace/chroot | cut -f1)" \
            > /workspace/custom-iso/casper/filesystem.size
          chroot /workspace/chroot dpkg-query \
            -W --showformat='${Package} ${Version}\n' | sort \
            > /workspace/custom-iso/casper/filesystem.manifest  

          # .disk/ and iso_overlay/
          cp -r /workspace/tooling/.disk /workspace/custom-iso/
          if [ -d /workspace/tooling/iso_overlay ]; then
            cp -r /workspace/tooling/iso_overlay/* /workspace/custom-iso/
          fi

          # GRUB BIOS
          grub-mkstandalone \
            --format=i386-pc \
            --output=/tmp/core.img \
            --install-modules="linux normal iso9660 biosdisk memdisk search tar ls" \
            --modules="linux normal iso9660 biosdisk search" \
            "boot/grub/grub.cfg=/workspace/custom-iso/boot/grub/grub.cfg"

          cat /usr/lib/grub/i386-pc/cdboot.img /tmp/core.img \
            > /workspace/custom-iso/boot/grub/bios.img

          # GRUB UEFI
          grub-mkstandalone \
            --format=x86_64-efi \
            --output=/tmp/bootx64.efi \
            "boot/grub/grub.cfg=/workspace/custom-iso/boot/grub/grub.cfg"

          # Copy 10 MBs from /dev/zero to an image file to create it
          dd if=/dev/zero of=/tmp/efi.img bs=1M count=10
          # Create a FAT filesystem there
          mkfs.fat /tmp/efi.img
          # Create the EFI/BOOT folder inside the image (-i to specify an image file)
          mmd -i /tmp/efi.img ::/EFI ::/EFI/BOOT
          # Copy the GRUB UEFI image to the EFI/BOOT directory inside this image
          mcopy -i /tmp/efi.img /tmp/bootx64.efi ::/EFI/BOOT/bootx64.efi

          mkdir -p /workspace/custom-iso/EFI/BOOT
          cp /tmp/bootx64.efi /workspace/custom-iso/EFI/BOOT/bootx64.efi
          # Keep a copy of the FAT image alongside the ISO content for xorriso
          cp /tmp/efi.img /workspace/custom-iso/boot/grub/efi.img

          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "Utile OS 26 amd64" \
            -eltorito-boot boot/grub/bios.img \
              -no-emul-boot \
              -boot-load-size 4 \
              -boot-info-table \
              --eltorito-catalog boot/grub/boot.cat \
              --grub2-boot-info \
              --grub2-mbr /usr/lib/grub/i386-pc/boot_hybrid.img \
            -eltorito-alt-boot \
              -e boot/grub/efi.img \
              -no-emul-boot \
              --protective-msdos-label \
            -append_partition 2 0xef /tmp/efi.img \
            -o /workspace/${{ env.ISO_NAME }}-amd64.iso \
            /workspace/custom-iso
        
          echo "ISO created: $(ls -lh /workspace/${{ env.ISO_NAME }}-amd64.iso)"

          # MEMTEST DISABLED, AS IT CAUSES ISSUES WITH LEGACY LIVE-BUILD HARDCODE. SHOULD BE RE-ENABLED IN THE FUTURE IF A SOLUTION IS FOUND.
          # lb config \
          #   --mode ubuntu \
          #   --bootstrap debootstrap \
          #   --bootstrap-keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg \
          #   --distribution resolute \
          #   --parent-distribution resolute \
          #   --architectures amd64 \
          #   --archive-areas "main restricted universe multiverse" \
          #   --parent-archive-areas "main restricted universe multiverse" \
          #   --mirror-bootstrap http://archive.ubuntu.com/ubuntu/ \
          #   --mirror-binary http://archive.ubuntu.com/ubuntu/ \
          #   --mirror-binary-security http://security.ubuntu.com/ubuntu/ \
          #   --mirror-chroot http://archive.ubuntu.com/ubuntu/ \
          #   --mirror-chroot-security http://security.ubuntu.com/ubuntu/ \
          #   --bootloader grub \
          #   --bootappend-live "boot=casper username=ubuntu quiet splash" \
          #   --initramfs casper \
          #   --binary-images iso-hybrid \
          #   --iso-application "Utile OS Live" \
          #   --iso-volume "Utile OS 26 amd64" \
          #   --iso-publisher 'Utile; https://utile-os-web.mailworker.workers.dev; proman4713@gmail.com' \
          #   --memtest none

          # mkdir -p /workspace/build/config/archives
          # cp -r /workspace/tooling/config/archives/* /workspace/build/config/archives/

          # mkdir -p /workspace/build/config/hooks
          # cp -r /workspace/tooling/config/hooks/* /workspace/build/config/hooks/
          # chmod +x /workspace/build/config/hooks/*

          # mkdir -p /workspace/build/config/package-lists
          # cp -r /workspace/tooling/config/package-lists/* /workspace/build/config/package-lists/

          # mkdir -p /workspace/build/config/includes.chroot
          # cp -r /workspace/tooling/config/includes.chroot/* /workspace/build/config/includes.chroot/

          # mkdir -p /workspace/build/config/includes.binary
          # cp -r /workspace/tooling/config/includes.binary/* /workspace/build/config/includes.binary/

          # mkdir -p /workspace/build/config/preseed
          # cp -r /workspace/tooling/config/preseed/* /workspace/build/config/preseed/

          # lb build --verbose
          # mv *.iso /workspace/${{ env.ISO_NAME }}-amd64.iso
          # lb clean --purge
          EOF
          ) > ${{ github.workspace }}/temp/docker-live-build.sh

          docker run --privileged -v ${{ github.workspace }}:/workspace --platform linux/amd64 --name utile-build-container -w /workspace ubuntu:26.04 /bin/bash /workspace/temp/docker-live-build.sh
    
      - name: Upload script to GitHub Releases
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Utile OS ${{ env.TAG_NAME }}
          files: |
            dist/${{ env.SH_NAME }}
          # Automatically mark as pre-release if it's a nightly or beta
          prerelease: ${{ contains(env.TAG_NAME, 'nightly') || contains(env.TAG_NAME, 'beta') }}

      - name: Upload ISO to Gofile.io
        env:
          GOFILE_KEY: ${{ secrets.GOFILE_KEY }}
        run: |
          RESPONSE=$(curl --progress-bar --retry 3 -X POST -F "file=@${{ env.ISO_NAME }}-amd64.iso" -F "folderId=99d5ecff-d083-417b-9c48-c04d0b6eae11" -H "Authorization: Bearer ${{ env.GOFILE_KEY }}" -H "Accept: application/json" "https://upload.gofile.io/contents/uploadfile")
          CONTENT_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          echo "Uploaded ISO to Gofile with ID: $CONTENT_ID"
          
          # calculate sha256 checksum
          sha256sum ${{ env.ISO_NAME }}-amd64.iso > ${{ env.ISO_NAME }}-amd64.iso.sha256sum
          echo "sha256sum: $(cat ${{ env.ISO_NAME }}-amd64.iso.sha256sum)"
          
          # Upload checksum to Gofile
          curl --progress-bar --retry 3 -X POST -F "file=@${{ env.ISO_NAME }}-amd64.iso.sha256sum" -F "folderId=99d5ecff-d083-417b-9c48-c04d0b6eae11" -H "Authorization: Bearer ${{ env.GOFILE_KEY }}" "https://upload.gofile.io/contents/uploadfile"