name: Build Utile OS 26 ISO

on:
#   push:
#     branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-custom-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
          
      - name: Install OS Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso mtools fdisk rsync

      - name: Compile Bash Script (Node.js)
        env:
          # If this was triggered by a tag (release), set to release. Otherwise, nightly will automatically be used.
          BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
        run: |
          # Install any dependencies your node script needs
          pnpm install 
          
          # Run the compilation script
          SH_NAME=$(node . | tail -n 1)

          TEMP_NAME=${SH_NAME#utile-os-}
          TAG_NAME=${TEMP_NAME%.sh}
          ISO_NAME="${SH_NAME%.sh}.iso"

          echo "SH_NAME=$SH_NAME" >> $GITHUB_ENV
          echo "ISO_NAME=$ISO_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          
          # Verify the output exists
          ls -la "dist/$SH_NAME"

      - name: Download Base Ubuntu 26.04 ISO
        run: |
          wget -q -O base-ubuntu-26.04.iso https://releases.ubuntu.com/resolute/ubuntu-26.04-desktop-amd64.iso

      - name: Extract Base ISO
        run: |
          mkdir -p source-iso custom-iso squashfs-root
          
          # Mount the original ISO and copy its contents
          sudo mount -o loop base-ubuntu-26.04.iso source-iso
          rsync -a source-iso/ custom-iso/
          sudo umount source-iso

      # CUBIC's trick to merge the squashfs (https://github.com/PJ-Singh-001/Cubic)
      - name: Extract and Merge Root Filesystems
        run: |
          if [ ! -f "custom-iso/casper/minimal.squashfs" ]; then
            echo "No squashfs found."
            exit 1
          fi

          MINIMAL_SQUASH="minimal.squashfs"
          STANDARD_SQUASH="minimal.standard.squashfs"
          MINIMAL_MANIFEST="minimal.manifest"
          MINIMAL_MANIFEST_FULL="minimal.manifest.full"
          STANDARD_MANIFEST="minimal.standard.manifest"
          STANDARD_MANIFEST_FULL="minimal.standard.manifest.full"
          MINIMAL_SIZE="minimal.size"
          STANDARD_SIZE="minimal.standard.size"

          echo "MINIMAL_SQUASH=$MINIMAL_SQUASH" >> $GITHUB_ENV
          echo "STANDARD_SQUASH=$STANDARD_SQUASH" >> $GITHUB_ENV
          echo "MINIMAL_MANIFEST=$MINIMAL_MANIFEST" >> $GITHUB_ENV
          echo "MINIMAL_MANIFEST_FULL=$MINIMAL_MANIFEST_FULL" >> $GITHUB_ENV
          echo "STANDARD_MANIFEST=$STANDARD_MANIFEST" >> $GITHUB_ENV
          echo "STANDARD_MANIFEST_FULL=$STANDARD_MANIFEST_FULL" >> $GITHUB_ENV
          echo "MINIMAL_SIZE=$MINIMAL_SIZE" >> $GITHUB_ENV
          echo "STANDARD_SIZE=$STANDARD_SIZE" >> $GITHUB_ENV

          lang_count="$(
            find "custom-iso/casper" -maxdepth 1 -name 'minimal.*.squashfs' \
                ! -name 'minimal.standard.squashfs' \
                ! -name 'minimal.standard.live.squashfs' \
                ! -name 'minimal.enhanced-secureboot.squashfs' \
            | wc -l
          )"

          echo "Found $lang_count languages, will be stripped"
          
          STAGING="$(sudo mktemp -d)"

          echo "Extracting minimal filesystem"
          sudo unsquashfs -f -d "$STAGING/squashfs-root" "custom-iso/casper/$MINIMAL_SQUASH"
          sudo rsync -aHAX "$STAGING/squashfs-root/" squashfs-root/
          sudo rm -rf "$STAGING"

          echo "Merging standard filesystem"
          TMP="$(sudo mktemp -d)"
          STANDARD_STAGING="$(sudo mktemp -d)"
          sudo unsquashfs -f -d "$STANDARD_STAGING/squashfs-root" "custom-iso/casper/$STANDARD_SQUASH"
          sudo rsync -aHAX "$STANDARD_STAGING/squashfs-root/" "$TMP/"
          sudo rm -rf "$STANDARD_STAGING"
          sudo rsync -aHAXc "$TMP/" squashfs-root/
          sudo rm -rf "$TMP"

          echo "Merge complete"

      - name: Log contents for debugging
        run: |
          ls -la custom-iso/casper/

          echo "Checking manifests"
          echo "Checking minimal.manifest"
          cat custom-iso/casper/minimal.manifest 2>/dev/null || echo "(minimal.manifest not present)"
          
          echo "Checking minimal.manifest.full"
          cat custom-iso/casper/minimal.manifest.full 2>/dev/null || echo "(minimal.manifest.full not present)"
          
          echo "Checking minimal.standard.manifest"
          cat custom-iso/casper/minimal.standard.manifest 2>/dev/null || echo "(minimal.standard.manifest not present)"
          
          echo "Checking minimal.standard.manifest.full"
          cat custom-iso/casper/minimal.standard.manifest.full 2>/dev/null || echo "(minimal.standard.manifest.full not present)"

          echo "Extracting snap section"
          MANIFEST_SNAPS=$(grep "snap:" custom-iso/casper/minimal.standard.manifest.full | grep -v "snap:firefox" | grep -v "snap:thunderbird")
          {
            echo "MANIFEST_SNAPS<<EOF"
            echo "$MANIFEST_SNAPS"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Setup Chroot Environment & Run Custom Script
        run: |
          # Copy script
          sudo cp dist/${{ env.SH_NAME }} squashfs-root/opt/
          sudo chmod +x squashfs-root/opt/${{ env.SH_NAME }}

          # Bind mounts
          sudo mount --bind /dev squashfs-root/dev
          sudo mount --bind /dev/pts squashfs-root/dev/pts
          sudo mount -t proc /proc squashfs-root/proc
          sudo mount -t sysfs /sys squashfs-root/sys
          sudo mount --bind /run squashfs-root/run
          sudo mount --bind /etc/resolv.conf squashfs-root/etc/resolv.conf

          # Fix for the "same file" error: Remove and copy with dereference
          sudo rm -f squashfs-root/etc/resolv.conf
          sudo cp -L /etc/resolv.conf squashfs-root/etc/resolv.conf

          # Execute in chroot
          sudo chroot squashfs-root /bin/bash -xlc "/opt/${{ env.SH_NAME }}"
          sudo rm -f squashfs-root/opt/${{ env.SH_NAME }}

          # Restore original resolv.conf
          sudo rm -f squashfs-root/etc/resolv.conf
          sudo chroot squashfs-root /bin/bash -xlc "sudo ln -s /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf"

          # Proper Cleanup (Unmount in reverse order)
          sudo umount --lazy squashfs-root/etc/resolv.conf
          sudo umount --lazy squashfs-root/run
          sudo umount --lazy squashfs-root/sys
          sudo umount --lazy squashfs-root/proc
          sudo umount --lazy squashfs-root/dev/pts
          sudo umount --lazy squashfs-root/dev

      - name: Copy INITRD to match Plymouth
        run: |
          # Copy the most recent initrd (by version sort)
          INITRD=$(ls -v squashfs-root/boot/initrd.img-* | tail -n 1)
          sudo cp "$INITRD" custom-iso/casper/initrd
    
      - name: Re-generate Manifests
        run: |
          set -exuo pipefail # Strict

          packages="$(dpkg-query --admindir="squashfs-root/var/lib/dpkg" --show 2>/dev/null)" || { echo "dpkg-query failed"; exit 1; }
          [[ -n "$packages" ]] || { echo "No packages found"; exit 1; }
          echo "Found snaps: ${{ env.MANIFEST_SNAPS }}"

          echo "Total $(wc -l <<< "$packages") packages found."
          manifest="custom-iso/casper/${{ env.MINIMAL_MANIFEST }}"
          echo "Generating Manifests"
          printf '%s' "$packages" | sudo tee "$manifest" > /dev/null
          if [[ -n "${{ env.MANIFEST_SNAPS }}" ]]; then
            echo -e "\n${{ env.MANIFEST_SNAPS }}" | sudo tee -a "$manifest" > /dev/null
          fi
          cat "$manifest"

          # Override minimal.manifest.full and minimal.manifest with the same content
          cat "$manifest" | sudo tee "custom-iso/casper/${{ env.MINIMAL_MANIFEST_FULL }}" > /dev/null
          cat "$manifest" | sudo tee "custom-iso/casper/${{ env.MINIMAL_MANIFEST }}" > /dev/null
          echo -e "\nGenerated Manifests"

          echo "Copying primary manifest to standard manifests"
          sudo cp "custom-iso/casper/${{ env.MINIMAL_MANIFEST }}" "custom-iso/casper/${{ env.STANDARD_MANIFEST_FULL }}"
          # minimal.standard.manifest only contains packages added over minimal.manifest, so it should be empty
          echo -e "" | sudo tee "custom-iso/casper/${{ env.STANDARD_MANIFEST }}"

          echo "Calculating combined squashfs size"
          combined_squash_bytes="$(sudo du -sx --block-size=1 "squashfs-root" | awk '{print $1}')"
          printf '%s\n' "$combined_squash_bytes" | sudo tee "custom-iso/casper/${{ env.MINIMAL_SIZE }}"
          printf '%s\n' "$combined_squash_bytes" | sudo tee "custom-iso/casper/${{ env.STANDARD_SIZE }}"
          echo "COMBINED_SIZE=$combined_squash_bytes" >> $GITHUB_ENV

      - name: Strip Language Layer
        run: |
          set -exuo pipefail # Strict

          patterns=(
            # Per-language minimal files (minimal.de.squashfs etc.)
            'minimal.[a-z][a-z].squashfs'
            'minimal.[a-z][a-z].manifest'
            'minimal.[a-z][a-z].manifest.full'
            'minimal.[a-z][a-z].size'
            # no-languages variants
            'minimal.no-languages.squashfs'
            'minimal.no-languages.manifest'
            'minimal.no-languages.manifest.full'
            'minimal.no-languages.size'
            # enhanced-secureboot variants (plain)
            'minimal.enhanced-secureboot.squashfs'
            'minimal.enhanced-secureboot.manifest'
            'minimal.enhanced-secureboot.manifest.full'
            'minimal.enhanced-secureboot.size'
            # enhanced-secureboot per-language
            'minimal.enhanced-secureboot.[a-z][a-z].squashfs'
            'minimal.enhanced-secureboot.[a-z][a-z].manifest'
            'minimal.enhanced-secureboot.[a-z][a-z].manifest.full'
            'minimal.enhanced-secureboot.[a-z][a-z].size'
            'minimal.enhanced-secureboot.no-languages.squashfs'
            'minimal.enhanced-secureboot.no-languages.manifest'
            'minimal.enhanced-secureboot.no-languages.manifest.full'
            'minimal.enhanced-secureboot.no-languages.size'
            # minimal.standard per-language
            'minimal.standard.[a-z][a-z].squashfs'
            'minimal.standard.[a-z][a-z].manifest'
            'minimal.standard.[a-z][a-z].manifest.full'
            'minimal.standard.[a-z][a-z].size'
            'minimal.standard.no-languages.squashfs'
            'minimal.standard.no-languages.manifest'
            'minimal.standard.no-languages.manifest.full'
            'minimal.standard.no-languages.size'
            # minimal.standard.enhanced-secureboot variants
            'minimal.standard.enhanced-secureboot.squashfs'
            'minimal.standard.enhanced-secureboot.manifest'
            'minimal.standard.enhanced-secureboot.manifest.full'
            'minimal.standard.enhanced-secureboot.size'
            'minimal.standard.enhanced-secureboot.[a-z][a-z].squashfs'
            'minimal.standard.enhanced-secureboot.[a-z][a-z].manifest'
            'minimal.standard.enhanced-secureboot.[a-z][a-z].manifest.full'
            'minimal.standard.enhanced-secureboot.[a-z][a-z].size'
            'minimal.standard.enhanced-secureboot.no-languages.squashfs'
            'minimal.standard.enhanced-secureboot.no-languages.manifest'
            'minimal.standard.enhanced-secureboot.no-languages.manifest.full'
            'minimal.standard.enhanced-secureboot.no-languages.size'
          )

          removed=0
          for pattern in "${patterns[@]}"; do
            while IFS= read -r -d '' f; do
                sudo rm -f "$f"
                echo "  Removed: $(basename "$f")"
                (( removed++ )) || true
            done < <(find "custom-iso/casper" -maxdepth 1 -name "$pattern" -print0 2>/dev/null)
          done
          echo "Stripped $removed variants from custom-iso/casper"
    
      - name: Patch install-sources.yaml
        run: |
          echo "Removing unwanted casper/ files"
          sudo yq -i '
            .sources |= map(select(.id == "ubuntu-desktop-minimal")) |
            .sources[0].preinstalled_langs = ["en", ""] |
            .sources[0].size = ${{ env.COMBINED_SIZE }} |
            .sources[0].variations.minimal.size = ${{ env.COMBINED_SIZE }} |
            del(.sources[0].variations."minimal-enhanced-secureboot")
          ' custom-iso/casper/install-sources.yaml

      - name: Apply Custom System Metadata
        run: |
          # Matches: Disk Name and Release
          echo 'Utile OS 26 "Abstract Assembly" - Release amd64 (${{ env.TAG_NAME }})' | sudo tee custom-iso/.disk/info
          
          # Matches: Release URL
          echo 'https://github.com/Proman4713/Utile-OS/releases/tag/${{ env.TAG_NAME }}' | sudo tee custom-iso/.disk/release_notes_url

      - name: Re-compress Root Filesystem
        run: |
          sudo rm "custom-iso/casper/${{ env.MINIMAL_SQUASH }}"
          
          # Compress the modified filesystem in place of the original
          echo "Compressing minimal squashfs"
          sudo mksquashfs squashfs-root "custom-iso/casper/${{ env.MINIMAL_SQUASH }}" -comp xz -noappend
          
          echo "Compressed minimal squashfs"

          echo "Creating empty standard squashfs"
          empty_directory="$(mktemp -d)"
          sudo mksquashfs "$empty_directory" "custom-iso/casper/${{ env.STANDARD_SQUASH }}" -comp xz -noappend
          rmdir "$empty_directory"

          echo "Created empty standard squashfs"

      - name: Inject GRUB theme into Live USB
        run: |
          set -exuo pipefail # Strict

          mkdir -p temp-grub/

          if ! curl -fsSL https://proman4713.github.io/Utile-OS-apt/public.key | sudo gpg --dearmor -o /etc/apt/keyrings/utile.gpg; then
            echo "Error: Failed to download or install Utile GPG key" >&2
            exit 1
          fi
          echo "deb [signed-by=/etc/apt/keyrings/utile.gpg] https://proman4713.github.io/Utile-OS-apt/ abstract main upstream universe" | sudo tee /etc/apt/sources.list.d/utile.list
          sudo apt-get update

          wget -qO utile-grub-theme.deb $(apt download --print-uris utile-grub-theme 2>/dev/null | awk -F"'" '{print $2}')
          sudo dpkg -x utile-grub-theme.deb temp-grub/

          sudo mkdir -p custom-iso/boot/grub/themes/utile
          THEME_PATH="temp-grub/boot/grub/themes/utile"
          sudo cp -r $THEME_PATH/* custom-iso/boot/grub/themes/utile/

          original_grub_config=$(cat custom-iso/boot/grub/grub.cfg)
          echo 'set theme=($root)/boot/grub/themes/utile/theme.txt' | sudo tee custom-iso/boot/grub/grub.cfg
          echo "$original_grub_config" | sudo tee -a custom-iso/boot/grub/grub.cfg

          sudo sed 's/--class ubuntu/--class utile/g' -i custom-iso/boot/grub/grub.cfg
          sudo sed 's/menuentry "Try or Install Ubuntu" {/menuentry "Try or Install Utile OS" --class utile {/g' -i custom-iso/boot/grub/grub.cfg
          sudo sed 's/Ubuntu (safe graphics)/Utile OS (safe graphics)/g' -i custom-iso/boot/grub/grub.cfg

      - name: Update MD5 Checksums
        run: |
          cd custom-iso
          sudo rm -f md5sum.txt
          
          # Calculate new checksums for integrity verification during boot
          echo "Calculating MD5 checksums"
          sudo find . -type f \
            ! -name "md5sum.txt" \
            ! -path "./boot/*" \
            ! -name "boot.catalog" \
            -print0 | xargs -0 md5sum | sudo tee md5sum.txt
          cd ..

      - name: Generate Final ISO
        run: |
          # 1. Extract the Master Boot Record (MBR)
          dd if=base-ubuntu-26.04.iso bs=512 count=1 of=isohdpfx.bin

          # 2. Extract the hidden EFI partition
          # Using a more robust selector for the EFI partition type
          EFI_START=$(sfdisk -J base-ubuntu-26.04.iso | jq -r '.partitiontable.partitions[] | select(.type=="C12A7328-F81F-11D2-BA4B-00A0C93EC93B" or .type=="ef") | .start' | head -n 1)
          EFI_SIZE=$(sfdisk -J base-ubuntu-26.04.iso | jq -r '.partitiontable.partitions[] | select(.type=="C12A7328-F81F-11D2-BA4B-00A0C93EC93B" or .type=="ef") | .size' | head -n 1)
          
          dd if=base-ubuntu-26.04.iso bs=512 skip=$EFI_START count=$EFI_SIZE of=efi.img
          
          mkdir -p custom-iso/boot/grub
          sudo mv efi.img custom-iso/boot/grub/efi.img

          # 3. Generate the ISO with Large File Support (-iso-level 3)
          sudo xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "Utile OS 26 amd64" \
            -eltorito-boot boot/grub/i386-pc/eltorito.img \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --eltorito-catalog boot.catalog \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot \
            -isohybrid-mbr isohdpfx.bin \
            -isohybrid-gpt-basdat \
            -append_partition 2 0xef custom-iso/boot/grub/efi.img \
            -output ${{ env.ISO_NAME }} \
            -graft-points \
            "/=$(pwd)/custom-iso"

      - name: Upload script to GitHub Releases
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Utile OS ${{ env.TAG_NAME }}
          files: |
            dist/${{ env.SH_NAME }}
          # Automatically mark as pre-release if it's a nightly or beta
          prerelease: ${{ contains(env.TAG_NAME, 'nightly') || contains(env.TAG_NAME, 'beta') }}

      - name: Upload ISO to Gofile.io
        env:
          GOFILE_KEY: ${{ secrets.GOFILE_KEY }}
        run: |
          RESPONSE=$(curl --progress-bar --retry 3 -X POST -F "file=@${{ env.ISO_NAME }}" -F "folderId=d96e59a5-9121-4b18-9bb4-4a6228e66bcd" -H "Authorization: Bearer ${{ env.GOFILE_KEY }}" -H "Accept: application/json" "https://upload.gofile.io/contents/uploadfile")
          CONTENT_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          echo "Uploaded ISO to Gofile with ID: $CONTENT_ID"
          
          # calculate sha256 checksum
          sha256sum ${{ env.ISO_NAME }} > ${{ env.ISO_NAME }}.sha256sum
          echo "sha256sum: $(cat ${{ env.ISO_NAME }}.sha256sum)"
          
          # Upload checksum to Gofile
          curl --progress-bar --retry 3 -X POST -F "file=@${{ env.ISO_NAME }}.sha256sum" -F "folderId=d96e59a5-9121-4b18-9bb4-4a6228e66bcd" -H "Authorization: Bearer ${{ env.GOFILE_KEY }}" "https://upload.gofile.io/contents/uploadfile"