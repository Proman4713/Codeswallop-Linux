name: Generate Utile OS 26 ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  gen-custom-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Preseed snaps and inject disk release
        env:
          # If this was triggered by a tag (release), set to release. Otherwise, nightly will automatically be used.
          BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
        run: |
          pnpm install
          node src/preseed-snaps.js

          ISO_NAME=$(node src/inject-disk-release.js | tail -n 1)
          echo "ISO_NAME=$ISO_NAME" >> $GITHUB_ENV
    
      - name: Inject GRUB theme
        run: |
          set -exuo pipefail # Strict

          mkdir -p temp-grub/

          if ! curl -fsSL https://proman4713.github.io/Utile-OS-apt/public.key | sudo gpg --dearmor -o /etc/apt/keyrings/utile.gpg; then
            echo "Error: Failed to download or install Utile GPG key" >&2
            exit 1
          fi
          echo "deb [signed-by=/etc/apt/keyrings/utile.gpg] https://proman4713.github.io/Utile-OS-apt/ abstract main upstream universe" | sudo tee /etc/apt/sources.list.d/utile.list
          sudo apt-get update

          wget -qO utile-grub-theme.deb $(apt download --print-uris utile-grub-theme 2>/dev/null | awk -F"'" '{print $2}')
          sudo dpkg -x utile-grub-theme.deb temp-grub/

          sudo mkdir -p tooling/config/includes.binary/grub/themes/utile
          THEME_PATH="temp-grub/boot/grub/themes/utile"
          sudo cp -r $THEME_PATH/* tooling/config/includes.binary/grub/themes/utile/
    
      - name: Build
        run: |
          mkdir -p ${{ github.workspace }}/temp
          (cat << 'EOF'
          set -exuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y \
            live-build \
            debootstrap \
            ubuntu-keyring \
            squashfs-tools \
            xorriso \
            syslinux-utils \
            cpio
          apt-get upgrade -y

          mkdir -p /workspace/build
          cd /workspace/build
          # MEMTEST DISABLED, AS IT CAUSES ISSUES WITH LEGACY LIVE-BUILD HARDCODE. SHOULD BE RE-ENABLED IN THE FUTURE IF A SOLUTION IS FOUND.
          lb config \
            --mode ubuntu \
            --bootstrap debootstrap \
            --bootstrap-keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg \
            --distribution resolute \
            --parent-distribution resolute \
            --architectures amd64 \
            --archive-areas "main restricted universe multiverse" \
            --parent-archive-areas "main restricted universe multiverse" \
            --mirror-bootstrap http://archive.ubuntu.com/ubuntu/ \
            --mirror-binary http://archive.ubuntu.com/ubuntu/ \
            --mirror-binary-security http://security.ubuntu.com/ubuntu/ \
            --mirror-chroot http://archive.ubuntu.com/ubuntu/ \
            --mirror-chroot-security http://security.ubuntu.com/ubuntu/ \
            --bootloader grub \
            --bootappend-live "boot=casper username=ubuntu quiet splash" \
            --initramfs casper \
            --binary-images iso-hybrid \
            --iso-application "Utile OS Live" \
            --iso-volume "Utile OS 26 amd64" \
            --iso-publisher 'Utile; https://utile-os-web.mailworker.workers.dev; proman4713@gmail.com' \
            --memtest none

          mkdir -p /workspace/build/config/archives
          cp -r /workspace/tooling/config/archives/* /workspace/build/config/archives/

          mkdir -p /workspace/build/config/hooks
          cp -r /workspace/tooling/config/hooks/* /workspace/build/config/hooks/
          chmod +x /workspace/build/config/hooks/*

          mkdir -p /workspace/build/config/package-lists
          cp -r /workspace/tooling/config/package-lists/* /workspace/build/config/package-lists/

          mkdir -p /workspace/build/config/includes.chroot
          cp -r /workspace/tooling/config/includes.chroot/* /workspace/build/config/includes.chroot/

          mkdir -p /workspace/build/config/includes.binary
          cp -r /workspace/tooling/config/includes.binary/* /workspace/build/config/includes.binary/

          mkdir -p /workspace/build/config/preseed
          cp -r /workspace/tooling/config/preseed/* /workspace/build/config/preseed/

          lb build --verbose
          mv *.iso /workspace/${{ env.ISO_NAME }}-amd64.iso
          lb clean --purge
          EOF
          ) > ${{ github.workspace }}/temp/docker-live-build.sh

          docker run --privileged -v ${{ github.workspace }}:/workspace --platform linux/amd64 --name utile-build-container -w /workspace ubuntu:26.04 /bin/bash /workspace/temp/docker-live-build.sh
    
      - name: Compress Build Directory
        run: |
          set -euo pipefail # Strict

          echo "Workspace: $GITHUB_WORKSPACE"
          sudo chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE/build
          tree $GITHUB_WORKSPACE/tooling/config || true
          tree $GITHUB_WORKSPACE/build || true

          tar -czvf live-build-config.tar.gz -C $GITHUB_WORKSPACE/build .

      - name: Upload Build Directory
        uses: actions/upload-artifact@v7
        with:
          name: live-build-config
          path: live-build-config.tar.gz
          if-no-files-found: error
    
      - name: Upload ISO to Gofile.io
        env:
          GOFILE_KEY: ${{ secrets.GOFILE_KEY }}
        run: |
          RESPONSE=$(curl --progress-bar --retry 3 -X POST -F "file=@${{ env.ISO_NAME }}-amd64.iso" -F "folderId=d96e59a5-9121-4b18-9bb4-4a6228e66bcd" -H "Authorization: Bearer ${{ env.GOFILE_KEY }}" -H "Accept: application/json" "https://upload.gofile.io/contents/uploadfile")
          CONTENT_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          echo "Uploaded ISO to Gofile with ID: $CONTENT_ID"
          
          # calculate sha256 checksum
          sha256sum ${{ env.ISO_NAME }}-amd64.iso > ${{ env.ISO_NAME }}-amd64.iso.sha256sum
          echo "sha256sum: $(cat ${{ env.ISO_NAME }}-amd64.iso.sha256sum)"
          
          # Upload checksum to Gofile
          curl --progress-bar --retry 3 -X POST -F "file=@${{ env.ISO_NAME }}-amd64.iso.sha256sum" -F "folderId=d96e59a5-9121-4b18-9bb4-4a6228e66bcd" -H "Authorization: Bearer ${{ env.GOFILE_KEY }}" "https://upload.gofile.io/contents/uploadfile"